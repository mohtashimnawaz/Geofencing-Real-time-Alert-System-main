services:
  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      DATA_FILE: /data/geopulse-data.json
    volumes:
      - geopulse-data:/data
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on: [backend]
volumes:
  geopulse-data:
